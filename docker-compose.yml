name: deployforge
networks:
  default:
    name: deployforge
volumes: { pgdata: {}, routes: {}, grafana: {} }

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://forge:${POSTGRES_PASSWORD:-forge}@postgres:5432/forge
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY:-change-me}
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  DOMAIN: ${DOMAIN:-localhost}
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
  APP_SCHEME: ${APP_SCHEME:-http}
  APP_PORT: ${APP_PORT:-}
  DEV_LOGIN: ${DEV_LOGIN:-1}

services:
  # Reverse proxy: reads ONLY route files from the shared "routes" volume (no Docker socket needed).
  traefik:
    image: traefik:v3.6
    command:
      - --providers.file.directory=/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
    ports: ["${APP_PORT:-80}:80"]
    volumes: ["routes:/dynamic:ro"]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: forge, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-forge}", POSTGRES_DB: forge }
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U forge"], interval: 3s, retries: 20 }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    environment: *backend-env
    volumes: ["/var/run/docker.sock:/var/run/docker.sock", "routes:/dynamic"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
    restart: unless-stopped

  worker:
    build: ./backend
    command: python -m app.worker
    environment: *backend-env
    volumes: ["/var/run/docker.sock:/var/run/docker.sock", "routes:/dynamic"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
    restart: unless-stopped

  frontend:
    build: ./frontend
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    volumes: ["/:/rootfs:ro", "/var/run:/var/run:ro", "/sys:/sys:ro", "/var/lib/docker/:/var/lib/docker:ro"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: http://grafana.${DOMAIN:-localhost}${APP_PORT:+:}${APP_PORT:-}
    volumes: ["grafana:/var/lib/grafana", "./infra/grafana/provisioning:/etc/grafana/provisioning:ro", "./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro"]
    restart: unless-stopped
